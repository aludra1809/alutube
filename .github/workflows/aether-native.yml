name: Aether native build

# Builds the vendored Aether Rust library for Android ABIs with cargo-ndk and
# verifies that `assembleContinuous` packages the jniLibs without manual .so
# copies. Mirrors the upstream Aether `android` job (NDK r26d, cargo-ndk) and
# deliberately leaves the `tor` feature off (see AETHER_INTEGRATION_PLAN.md §9).

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'aether/**'
      - 'app/aether-native.gradle'
      - 'app/build.gradle.kts'
      - '.github/workflows/aether-native.yml'
  push:
    branches:
      - main
    paths:
      - 'aether/**'
      - 'app/aether-native.gradle'
      - 'app/build.gradle.kts'
      - '.github/workflows/aether-native.yml'

jobs:
  build-android-abis:
    name: Build Aether for ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
          - abi: x86_64
            target: x86_64-linux-android
    defaults:
      run:
        # The bridge crate (aether-bridge/) produces libaether_bridge.so and
        # depends on ../aether/aether by path; build from there.
        working-directory: aether-bridge
    steps:
      - uses: actions/checkout@v6
        with:
          # Check out the actual event ref (the repo's GitHub default branch
          # may still be named "master", which does not exist in this repo).
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Aether bridge library (no tor feature)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo ndk -t ${{ matrix.abi }} --platform 23 -o ../app/src/main/jniLibs build --release --locked

      - name: Verify libaether_bridge.so exists
        run: |
          test -f ../app/src/main/jniLibs/${{ matrix.abi }}/libaether_bridge.so
          ls -la ../app/src/main/jniLibs/${{ matrix.abi }}/

  gradle-packaging:
    runs-on: ubuntu-latest
    needs: build-android-abis
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Install Rust toolchain (all Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install cargo-ndk and cargo-ndk cache for Gradle
        run: cargo install cargo-ndk --locked

      - name: Build debug APK with native Aether (Gradle task pipeline)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: ./gradlew assembleContinuous -DskipFormatKtlint --stacktrace

      - name: Verify Aether libraries packaged into APK
        run: |
          APK=$(ls app/build/outputs/apk/continuous/*.apk | head -1)
          echo "APK: $APK"
          unzip -l "$APK" | grep -E "lib/(arm64-v8a|armeabi-v7a|x86_64)/libaether_bridge.so"